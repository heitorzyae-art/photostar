[package]
name = "photostar-io"
description = "Import/export between photostar documents and PSD/PSB and flat raster formats"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []
# HEIC/HEIF decode (forwarded to photostar-codecs; see its `heif` feature).
heif = ["photostar-codecs/heif"]

[dependencies]
photostar-geom = { workspace = true }
photostar-color = { workspace = true }
photostar-cms = { workspace = true }
photostar-raster = { workspace = true }
photostar-doc = { workspace = true }
photostar-compose = { workspace = true }
photostar-algo = { workspace = true }
photostar-psd = { workspace = true }
photostar-codecs = { workspace = true }
photostar-raw = { workspace = true }
photostar-affinity = { workspace = true }
photostar-text = { workspace = true }
photostar-paint = { workspace = true }
photostar-vector = { workspace = true }
photostar-format = { path = "../format" }
craft-docpath = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
# svg.rs inflates `.svgz` itself (with a size cap) so the XML can be checked before it is parsed;
# pdn.rs inflates Paint.NET's gzip pixel chunks.
flate2 = { workspace = true }
# ora.rs reads OpenRaster's stack.xml (already in the tree through usvg).
roxmltree = "0.21"
# SVG import (svg.rs): usvg parses, resvg rasterises what the shape model can't hold. Both are
# already in the tree through the UI's icon loader; text shaping needs the fonts feature set.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }

[dev-dependencies]
crc32fast = "1.5"
photostar-affinity = { workspace = true, features = ["synth"] }
flate2 = { workspace = true }
photostar-psd = { workspace = true, features = ["testgen"] }
photostar-raw = { workspace = true, features = ["testgen"] }
photostar-testkit = { workspace = true }
proptest = { workspace = true }
# Lossless JPEG XL encoder for the JPEG XL DNG preview test (tests only), as in photostar-raw.
zune-jpegxl = { version = "=0.5.2", default-features = false, features = ["std"] }
zune-core = { workspace = true }
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"] }
